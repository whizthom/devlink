<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit Project | DevLink</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styling -->
    <style>
        /* Gradient border (DevLink brand) */
        .gradient-border {
            border: 3px solid transparent;
            border-radius: 1rem;
            background: linear-gradient(#fff, #fff) padding-box,
            linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff) border-box;
        }

        /* Modal backdrop blur */
        .modal-backdrop.show {
            backdrop-filter: blur(5px);
        }

        /* Modal content styling */
        .modal-content {
            border-radius: 1rem;
            padding: 1.5rem;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: fadeInUp 0.4s ease;
        }

        /* Smooth animation */
        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* DevLink button style */
        .btn-gradient {
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body class="bg-light">

<!-- Trigger Button -->
<div class="container text-center my-5">
    <button class="btn-gradient" data-bs-toggle="modal" data-bs-target="#editProjectModal">
        Edit Project
    </button>
</div>

<!--cancel (go back to project view)-->
<div class="container text-center my-5">
    <button class="btn-gradient" onclick="history.back()">
        Cancel
    </button>
</div>

<!-- Edit Project Modal -->
<div class="modal fade" id="editProjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content gradient-border">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0 fw-bold text-dark">✏️ Edit Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Form -->
            <form th:action="@{/project/new}" th:object="${project}" method="post">

                <input type="hidden" th:field="*{id}" name="project_id">

                <div class="mb-3">
                    <label class="form-label">Project Title</label>
                    <input type="text" class="form-control" th:field="*{title}" placeholder="Enter project title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="4" th:field="*{description}" placeholder="Describe your project..." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tech Stack</label>
                    <input class="form-control" th:field="*{techStack}" placeholder="Enter stack name(s)" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Github Url</label>
                    <input class="form-control" th:field="*{githubUrl}" placeholder="Enter github url" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Live Url</label>
                    <input class="form-control" th:field="*{liveUrl}" placeholder="Enter live url" required>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn-gradient">Save Changes</button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
