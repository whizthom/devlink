<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Experience</title>
  <style>
    :root {
      --brand-1:#ff00ff;
      --brand-2:#00ffff;
      --ink-900:#0f172a;
      --ink-700:#334155;
      --line:#e5e7eb;
      --primary:#0ea5e9;
    }

    /* Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.65);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 1rem;
    }

    /* Modal */
    .modal {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      padding: 28px 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,.15);
      animation: slideIn 0.3s ease-out;
      border: 1px solid rgba(0,0,0,.06);

      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    @keyframes slideIn {
      from {opacity:0; transform: translateY(-25px);}
      to {opacity:1; transform: translateY(0);}
    }

    /* Header */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 20px;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(90deg,var(--brand-1),var(--brand-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--ink-700);
      transition: color 0.2s, transform 0.2s;
    }
    .close-btn:hover {
      color: var(--ink-900);
      transform: rotate(90deg);
    }

    /* Form */
    .modal-form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--ink-900);
      font-size: 0.95rem;
    }

    .modal-form input,
    .modal-form textarea,
    .modal-form select {
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .modal-form input:focus,
    .modal-form textarea:focus,
    .modal-form select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14,165,233,.18);
      outline: none;
    }

    .modal-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* Footer */
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
      position: sticky;
      bottom: 0;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(8px);
      padding-top: 12px;
      z-index: 10;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.25s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-cancel {
      background: #f8fafc;
      color: var(--ink-700);
      border: 1px solid var(--line);
    }
    .btn-cancel:hover {
      background: #f1f5f9;
    }

    .btn-save {
      background: linear-gradient(90deg,var(--brand-1),var(--brand-2));
      color: #fff;
      box-shadow: 0 4px 12px rgba(14,165,233,.25);
    }
    .btn-save:hover {
      opacity: .9;
    }
  </style>
</head>
<body>

<!-- Modal -->
<div id="expModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Edit Experience</h2>
      <a th:href="@{/dashboard}" class="close-btn">&times;</a>
    </div>

    <form class="modal-form" th:action="@{/experience/update}" th:object="${exp}" method="post">
      <input type="hidden" th:field="*{id}" />

      <label for="title">Job Title</label>
      <input type="text" id="title" th:field="*{title}" placeholder="Enter job title" required>

      <label for="company">Company</label>
      <input id="company" type="text" th:field="*{company}" placeholder="e.g., Microsoft, Coursera" required>

      <label for="description">Description</label>
      <textarea id="description" th:field="*{description}" placeholder="Enter description" required></textarea>

      <label for="location">Location</label>
      <select id="location" th:field="*{location}" required>
        <option value="">Select location</option>
        <option value="Remote">Remote</option>
        <option value="Onsite">Onsite</option>
        <option value="Hybrid">Hybrid</option>
      </select>

      <label for="startDate">Start Date</label>
      <input type="date" id="startDate" th:field="*{startDate}" required>

      <label for="endDate">End Date</label>
      <input type="date" id="endDate" th:field="*{endDate}">

      <div class="modal-footer">
        <a th:href="@{/dashboard}" type="button" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-save">Save Changes</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
