<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Onboarding | DevLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 🔹 NAVIGATION BAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">DevLink</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/profile">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- 🔹 DASHBOARD HEADER -->
<div class="container my-4">
  <div class="card shadow p-4">
    <h4 class="mb-0">Welcome, <span th:text="${user.username}">User</span> 👋</h4>
    <small class="text-muted">Complete your onboarding below</small>
  </div>
</div>

<!-- 🔹 PROGRESS BAR -->
<div class="container">
  <div class="progress mb-4" style="height: 25px;">
    <div class="progress-bar progress-bar-striped bg-success fw-bold"
         role="progressbar"
         th:style="'width:' + ${progress} + '%'"
         th:text="${progress + '% Completed'}">
    </div>
  </div>
</div>

<!-- 🔹 FORMS -->
<div class="container">

  <!-- STEP 1: PROFILE FORM -->
  <section th:if="${progress >= 0 && progress < 33}" class="card shadow p-4 mb-4">
    <h5>Step 1: Profile Setup</h5>
    <form th:action="@{/profile/setup/update}" th:object="${user}" method="post">
      <div class="mb-3">
        <label class="form-label">Skills</label>
        <input type="text" name="skillsInput" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Bio</label>
        <textarea th:field="*{bio}" class="form-control" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save & Continue</button>
    </form>
  </section>

  <!-- STEP 2: EXPERIENCE FORM -->
  <section th:if="${progress >= 33 && progress < 66}" class="card shadow p-4 mb-4">
    <h5>Step 2: Experience</h5>
    <form th:action="@{/profile/setup/experience}" th:object="${experience}" method="post">
      <div class="mb-3">
        <label class="form-label">Job Title</label>
        <input type="text" th:field="*{title}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Company</label>
        <input type="text" th:field="*{company}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" th:field="*{startDate}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">End Date</label>
        <input type="date" th:field="*{endDate}" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Save & Continue</button>
    </form>
  </section>

  <!-- STEP 3: CERTIFICATION FORM -->
  <section th:if="${progress >= 66}" class="card shadow p-4 mb-4">
    <h5>Step 3: Certifications</h5>
    <form th:action="@{/profile/setup/certification}" th:object="${certification}" method="post" >
      <div class="mb-3">
        <label class="form-label">Certification Name</label>
        <input type="text" th:field="*{title}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Issuing Organisation</label>
        <input type="text" th:field="*{issuingOrganization}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Date Issued</label>
        <input type="date" th:field="*{dateIssued}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Certification URL</label>
        <input type="url" th:field="*{certificateUrl}" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success">Save & Finish</button>
    </form>
  </section>

  <!-- STEP 4: COMPLETION -->
  <section th:if="${progress == 100}" class="alert alert-success shadow text-center p-4">
    <h5> Congratulations <span th:text="${user.username}"></span>!</h5>
    <p>Your onboarding is complete. You can now explore your full dashboard.</p>
    <a href="/dashboard" class="btn btn-dark">Go to Dashboard</a>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
