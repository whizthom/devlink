<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Project | DevLink</title>
    <style>
        :root {
            --brand-1:#ff00ff;
            --brand-2:#00ffff;
            --ink-900:#0f172a;
            --ink-700:#334155;
            --line:#e5e7eb;
            --primary:#0ea5e9;
        }

        body {
            font-family: Inter, system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #e0f7fa);
            color: var(--ink-900);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-card {
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 32px 36px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,.08);
            border: 1px solid rgba(0,0,0,.06);
        }

        .form-card h2 {
            margin: 0 0 20px;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg,var(--brand-1),var(--brand-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--ink-900);
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14,165,233,.18);
            outline: none;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.25s;
        }

        .btn-cancel {
            background: #f8fafc;
            color: var(--ink-700);
            border: 1px solid var(--line);
        }
        .btn-cancel:hover {
            background: #f1f5f9;
        }

        .btn-save {
            background: linear-gradient(90deg,var(--brand-1),var(--brand-2));
            color: #fff;
            box-shadow: 0 4px 12px rgba(14,165,233,.25);
        }
        .btn-save:hover {
            opacity: .9;
        }
        textarea {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 120px;
            resize: vertical;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14,165,233,.18);
            outline: none;
        }

    </style>
</head>
<body>

<div class="form-card">
    <h2>Add New Project</h2>

    <form th:action="@{/project/new}" th:object="${project}" method="post">

                <label class="form-label">Project Title</label>
                <input class="form-control" th:field="*{title}" placeholder="Enter Project Title" required/>

                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}" placeholder="Enter project description"></textarea>

                <label class="form-label">TechStack</label>
                <input class="form-control" th:field="*{techStack}" />

                <label class="form-label">Github Url</label>
                <input class="form-control" th:field="*{githubUrl}" />

                <label class="form-label">Live Url</label>
                <input class="form-control" th:field="*{liveUrl}" />

        <div class="actions">
            <a th:href="@{/dashboard}" type="button" class="btn btn-cancel">Cancel</a>
            <button type="submit" class="btn btn-save">Save Project</button>
        </div>
    </form>
</div>
</body>
</html>
