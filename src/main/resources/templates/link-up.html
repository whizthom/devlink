<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>DevLink | Link Up</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

    <style>
        :root{
            --brand-1:#ff00ff; --brand-2:#00ffff;
            --ink-900:#0f172a; --ink-800:#1f2937; --ink-700:#334155; --ink-600:#475569;
            --bg-soft:#f7f8fb; --card:#ffffff; --line:#eef2f7;
            --danger:#dc2626; --primary:#0ea5e9; --success:#16a34a;
        }
        body{
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
            background:var(--bg-soft); color:var(--ink-900);
        }
        /* Sidebar */
        .sidebar{
            position:fixed; inset:0 auto 0 0; width:270px;
            background:linear-gradient(180deg,#101827 0%,#0b1220 100%);
            color:#e5e7eb; z-index:1030; overflow-y:auto;
        }
        .sidebar .brand{display:flex;align-items:center;gap:.75rem;padding:1.25rem;font-weight:700}
        .sidebar .logo{width:36px;height:36px;border-radius:10px;background:conic-gradient(from 120deg,var(--brand-1),var(--brand-2))}
        .sidebar .menu a{display:flex;align-items:center;gap:.75rem;padding:.7rem .95rem;color:#cbd5e1;text-decoration:none;border-radius:12px}
        .sidebar .menu a:hover,.sidebar .menu a.active{background:linear-gradient(90deg,rgba(255,0,255,.14),rgba(0,255,255,.14));color:#fff}
        .main{margin-left:270px;min-height:100vh;display:flex;flex-direction:column;}
        .topbar{position:sticky;top:0;z-index:1020;background:#fff;border-bottom:1px solid var(--line);}
        .card-soft{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(2,8,20,.05);}
        /* Timeline */
        .timeline{position:relative;padding-left:2rem;}
        .timeline:before{content:"";position:absolute;left:0.8rem;top:0;bottom:0;width:2px;background:linear-gradient(180deg, rgba(15,23,42,.08), rgba(14,165,233,.25))}
        .timeline-item{position:relative;margin-bottom:2rem;}
        .timeline-item:before{content:"";position:absolute;left:-.55rem;top:1.2rem;width:12px;height:12px;background:var(--brand-2);border:2px solid #fff;border-radius:50%;}
        .item-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem;transition:.2s;}
        .item-card:hover{box-shadow:0 10px 26px rgba(2,8,20,.06);transform:translateY(-2px);}
        .user-meta{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem;}
        .user-meta img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
        .user-meta a{font-weight:600;color:var(--ink-800);text-decoration:none;}
        .user-meta a:hover{color:var(--primary);}
        @media (max-width:991.98px){
            .sidebar{width:84px}
            .sidebar .brand span,.sidebar .menu .label{display:none}
            .main{margin-left:84px}
        }

        .gradient-underline{ position:relative; display:inline-block; }
        .gradient-underline:after{
            content:""; position:absolute; left:0; right:0; bottom:-6px; height:3px; border-radius:999px;
            background:linear-gradient(90deg,var(--brand-1),var(--brand-2));
        }

        /* ===== Number badges ===== */
        .number-badge{
            --sz:46px; width:var(--sz); height:var(--sz);
            font-size:18px; font-weight:700; border-radius:50%;
            display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 var(--sz);
            box-shadow:0 6px 16px rgba(0,0,0,.15);
        }
        .exp-badge{ background:linear-gradient(135deg,#ff512f,#dd2476); }
        .cert-badge{ background:linear-gradient(135deg,#36d1dc,#5b86e5); }
        .skill-badge{background:linear-gradient(135deg,#ff00ff, #670058); }
    </style>
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar">
    <div class="brand"><div class="logo"></div><span>DevLink</span></div>
    <nav class="menu">
        <a th:href="@{/dashboard}" class="active"><i class="bi bi-speedometer2"></i><span class="label">Dashboard</span></a>
        <a th:href="@{/link/view}"><i class="bi bi-person"></i><span class="label">Link Up</span></a>
        <a th:href="@{/skill}"><i class="bi bi-layers"></i><span class="label">All Skills</span></a>
        <a th:href="@{/project/view}"><i class="bi bi-kanban"></i><span class="label">Projects</span></a>
        <div class="section">Account</div>
        <a th:href="@{/settings}"><i class="bi bi-gear"></i><span class="label">Settings</span></a>
        <a th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i><span class="label">Logout</span></a>
    </nav>
</aside>

<!-- Main -->
<main class="main">
    <!-- Topbar -->
    <header class="topbar card-soft py-3">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <h1 class="h5 mb-0 gradient-underline">Link Up</h1>
            <form class="d-none d-md-flex align-items-center gap-2" onsubmit="return false">
                <i class="bi bi-search soft-muted"></i>
                <input class="search form-control form-control-sm" id="globalSearch" type="search" placeholder="Search project…"/>
            </form>
            <div class="dropdown">
                <button class="btn btn-sm btn-light border dropdown-toggle" data-bs-toggle="dropdown">
                    <img th:src="${profileImageUrl}" src="https://via.placeholder.com/32" class="rounded-circle me-2" width="32" height="32"/>
                    <span th:text="${username}">User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person"></i> Profile</a></li>
                    <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear"></i> Settings</a></li>
                    <li><hr class="dropdown-divider"/></li>
                    <li><a class="dropdown-item" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Content -->
    <section class="container-fluid px-4 py-4">

        <!-- ===== Overview KPIs ===== -->
        <div class="row g-3 mb-3">
            <div class="col-6 col-lg-3">
                <div class="card-soft p-3 d-flex gap-2 align-items-center">
                    <div class="number-badge exp-badge" aria-hidden="true"><i class="bi bi-briefcase"></i></div>
                    <div>
                        <div class="soft-muted small">Total Users</div>
                        <div class="fs-5 fw-semibold" th:text="${#lists.size(users)}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card-soft p-3 d-flex gap-2 align-items-center">
                    <div class="number-badge cert-badge" aria-hidden="true"><i class="bi bi-award"></i></div>
                    <div>
                        <div class="soft-muted small">Total Projects</div>
                        <div class="fs-5 fw-semibold" th:text="${#lists.size(projects)}">0</div>
                    </div>
                </div>
            </div>

        <div class="card-soft p-3">
            <div class="timeline" th:if="${!#lists.isEmpty(users)}">
                <div th:each="user : ${users}">
                    <div th:each="proj : ${user.projects}" class="timeline-item"
                         id="project-[[${proj.id}]]">
                        <div class="item-card">
                            <!-- User Meta -->
                            <div class="user-meta">
                                <a th:href="@{/profile/{id}(id=${user.id})}">
                                    <img th:src="${profileImageUrl}" src="https://via.placeholder.com/40" alt="Profile"/>
                                </a>
                                <div>
                                    <a th:href="@{/profile/{id}(id=${user.id})}" th:text="${user.username}">Username</a>
                                    <div class="small text-muted">posted a project</div>
                                </div>
                            </div>

                            <!-- Project Title -->
                            <h6 th:text="${proj.title}" class="fw-semibold mb-1">Project Title</h6>
                            <p class="soft-muted small mb-2" th:text="${proj.description}">Short description</p>

                            <!-- Tech stack -->
                            <div class="mb-2">
                <span class="badge bg-light text-dark">
                  <i class="bi bi-code-slash"></i>
                  <span th:text="${proj.techStack}">Java, Spring</span>
                </span>
                            </div>

                            <!-- Actions (owner only) -->
                            <div class="d-flex gap-2 mb-3" th:if="${proj.user.id == currentUser.id}">
                                <a th:href="@{/project/edit-form/{id}(id=${proj.id})}" class="btn btn-sm btn-outline-primary btn-pill"><i class="bi bi-pencil"></i> Edit</a>
                                <a th:href="@{/project/delete/{id}(id=${proj.id})}" onclick="return confirm('Delete this project?')" class="btn btn-sm btn-outline-danger btn-pill"><i class="bi bi-trash"></i> Delete</a>
                            </div>

                            <!-- Likes & Comments -->
                            <div class="border-top pt-2">
                                <div class="d-flex align-items-center mb-2">
                                    <form th:action="@{/like/new/{id}(id=${proj.id})}" method="post" class="me-2">
                                        <button type="submit" class="btn btn-sm btn-outline-success"><i class="bi bi-hand-thumbs-up"></i></button>
                                    </form>
                                    <span th:text="${#lists.size(proj.likes) + ' likes'}" class="text-muted small">Likes</span>
                                </div>
                                <div class="comments mb-2">
                                    <h6 class="small text-muted">Comments</h6>
                                    <div th:if="${#lists.isEmpty(proj.comments)}" class="text-muted small">No comments yet.</div>
                                    <div th:each="c : ${proj.comments}" class="mb-1 p-2 rounded bg-light">
                                        <strong th:text="${c.author.username}">User</strong>: <span th:text="${c.content}">Nice project!</span>
                                    </div>
                                </div>
                                <form th:action="@{/comment/new/{id}(id=${proj.id})}" method="post" class="d-flex mt-2">
                                    <input name="content" class="form-control form-control-sm me-2" placeholder="Write a comment..." required/>
                                    <button type="submit" class="btn btn-sm btn-primary">Post</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
